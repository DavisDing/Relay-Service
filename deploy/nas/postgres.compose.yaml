# Optional shared PostgreSQL instance. This file is independent of Relay's
# default Compose. Join a common network when connecting separate projects.
name: relay-database

services:
  postgres:
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set PostgreSQL administrator password}
      RELAY_DB_PASSWORD: ${RELAY_DB_PASSWORD:?set Relay owner password}
      RELAY_MIGRATOR_PASSWORD: ${RELAY_MIGRATOR_PASSWORD:?set Relay schema password}
      RELAY_APP_PASSWORD: ${RELAY_APP_PASSWORD:?set Relay business password}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./init-db/001-roles.sh:/docker-entrypoint-initdb.d/001-relay.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres-data:

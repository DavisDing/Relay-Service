name: relay-service

services:
  relay:
    image: ghcr.io/davisding/relay-service:latest
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - relay-secrets:/relay-secrets
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: ghcr.io/davisding/relay-service-postgres:latest
    restart: unless-stopped
    volumes:
      - relay-postgres:/var/lib/postgresql
      - relay-secrets:/relay-secrets

volumes:
  relay-postgres:
  relay-secrets:

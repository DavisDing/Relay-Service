# Optional settings. Merge explicitly; .env alone does not inject environment.
services:
  relay:
    image: ${RELAY_IMAGE:-ghcr.io/davisding/relay-service:latest}
    environment:
      RELAY_PUBLIC_URL: ${RELAY_PUBLIC_URL:-}
      RELAY_SECURE_COOKIES: ${RELAY_SECURE_COOKIES:-}
      RELAY_LOG_LEVEL: ${RELAY_LOG_LEVEL:-info}

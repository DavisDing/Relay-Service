name: Publish NAS release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag on the default branch (vX.Y.Z or vX.Y.Z-prerelease)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Validate the existing release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      image: ${{ steps.release.outputs.image }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      created: ${{ steps.release.outputs.created }}
    steps:
      - name: Check out default-branch release tooling and complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve tag and require default-branch ancestry
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 .github/scripts/release_context.py

  verify:
    needs: resolve
    uses: ./.github/workflows/verify.yml
    with:
      source-ref: ${{ needs.resolve.outputs.commit }}
      version: ${{ needs.resolve.outputs.tag }}

  publish:
    name: Publish GHCR image and complete GitHub Release
    needs: [resolve, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
      RELEASE_IMAGE: ${{ needs.resolve.outputs.image }}
      RELEASE_PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
      DOCKER_BUILD_SUMMARY: "false"
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Check out the exact verified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse to overwrite a published release
        id: existing
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request
          url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/releases/tags/{os.environ['RELEASE_TAG']}"
          request = urllib.request.Request(url, headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  release = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          else:
              if not release['draft']:
                  raise SystemExit("Refusing to replace an already published release")
              if release['target_commitish'] != os.environ['RELEASE_COMMIT']:
                  raise SystemExit("Existing draft targets a different commit; inspect it before retrying")
              metadata_url = next((item['url'] for item in release['assets'] if item['name'] == 'release-metadata.json'), None)
              if metadata_url is None:
                  raise SystemExit("Existing draft has no release metadata; inspect it before retrying")
              request = urllib.request.Request(metadata_url, headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/octet-stream"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  metadata = json.load(response)
              if metadata.get('git_commit') != os.environ['RELEASE_COMMIT'] or metadata.get('version') != os.environ['RELEASE_TAG']:
                  raise SystemExit("Existing draft metadata does not match this release; inspect it before retrying")
              image = metadata.get('image', '')
              if not re.fullmatch(re.escape(os.environ['RELEASE_IMAGE']) + r'@sha256:[0-9a-f]{64}', image):
                  raise SystemExit("Existing draft image identity is incompatible; inspect it before retrying")
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
                  output.write(f"image={image}\n")
          PY
      - name: Recheck the remote tag before publishing packages
        run: python3 .github/scripts/check_release_tag.py
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish the verified source
        id: image
        if: steps.existing.outputs.image == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/nas/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.resolve.outputs.image }}:${{ needs.resolve.outputs.tag }}
          build-args: |
            VERSION=${{ needs.resolve.outputs.tag }}
            REVISION=${{ needs.resolve.outputs.commit }}
            CREATED=${{ needs.resolve.outputs.created }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.commit }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.tag }}
      - name: Select the published digest or matching draft digest
        id: published
        env:
          EXISTING_IMAGE: ${{ steps.existing.outputs.image }}
          BUILT_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          image="$EXISTING_IMAGE"
          if [ -z "$image" ]; then image="${RELEASE_IMAGE}@${BUILT_DIGEST}"; fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Check the published Linux amd64 digest without a database
        env:
          PUBLISHED_IMAGE: ${{ steps.published.outputs.image }}
        run: |
          docker pull --platform linux/amd64 "$PUBLISHED_IMAGE"
          sh scripts/container-smoke.sh "$PUBLISHED_IMAGE" "$RELEASE_TAG" "$RELEASE_COMMIT"
      - name: Package NAS assets with the published image digest
        env:
          PUBLISHED_IMAGE: ${{ steps.published.outputs.image }}
        run: |
          sh scripts/package-release.sh "$RELEASE_TAG" "$PUBLISHED_IMAGE" dist/release
          (cd dist/release && sha256sum -c SHA256SUMS)
      - name: Recheck the tag and compare existing draft assets
        env:
          EXISTING_IMAGE: ${{ steps.existing.outputs.image }}
        run: |
          python3 .github/scripts/check_release_tag.py
          if [ -n "$EXISTING_IMAGE" ]; then
            mkdir -p dist/existing
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir dist/existing
            diff -qr dist/existing dist/release
          fi
      - name: Upload all assets to a draft release, then publish
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --target "$RELEASE_COMMIT" --title "$RELEASE_TAG" \
              --generate-notes --draft
          fi
          gh release upload "$RELEASE_TAG" dist/release/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --prerelease="$RELEASE_PRERELEASE" --draft=false
      - name: Record published artifacts and acceptance limits
        env:
          PUBLISHED_IMAGE: ${{ steps.published.outputs.image }}
        run: |
          {
            echo "### Published ${RELEASE_TAG}"
            echo "- Commit: ${RELEASE_COMMIT}"
            echo "- Image: ${PUBLISHED_IMAGE}"
            echo '- amd64 passed container checks without a database; arm64 was built only.'
            echo '- PostgreSQL, NAS/UGOS import, upstream services and devices were not accepted by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
